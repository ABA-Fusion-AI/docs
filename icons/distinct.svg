<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img"
    aria-label="Remove duplicates">
    <title>Remove duplicates</title>
    <!-- list -->
    <circle cx="5" cy="7" r="1.4" fill="currentColor" />
    <circle cx="5" cy="12" r="1.4" fill="currentColor" />
    <circle cx="5" cy="17" r="1.4" fill="currentColor" />
    <line x1="9" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" />
    <line x1="9" y1="12" x2="16" y2="12" stroke="currentColor" stroke-width="2"
