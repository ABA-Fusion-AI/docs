<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Drop Shadow for realistic depth -->
    <filter id="ffxiv-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Cyan Glow for circuits and cores -->
    <filter id="ffxiv-cyan-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Intense Core Glow -->
    <radialGradient id="core-glow-1" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#80f7ff" />
      <stop offset="70%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#008394" />
    </radialGradient>

    <!-- Outer metallic casing gradient -->
    <linearGradient id="casing-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a433d" />
      <stop offset="25%" stop-color="#5c534a" />
      <stop offset="60%" stop-color="#2a2522" />
      <stop offset="100%" stop-color="#141211" />
    </linearGradient>

    <!-- Bevel highlight gradient -->
    <linearGradient id="bevel-grad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#73675a" />
      <stop offset="45%" stop-color="#3d3630" />
      <stop offset="100%" stop-color="#0f0e0d" />
    </linearGradient>

    <!-- Inner face plate gradient -->
    <linearGradient id="plate-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#332e2b" />
      <stop offset="40%" stop-color="#211e1c" />
      <stop offset="100%" stop-color="#121110" />
    </linearGradient>

    <!-- Gold connector gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70521c" />
      <stop offset="25%" stop-color="#b58d38" />
      <stop offset="50%" stop-color="#f5dc8a" />
      <stop offset="75%" stop-color="#c49b42" />
      <stop offset="100%" stop-color="#614414" />
    </linearGradient>

    <!-- Gold ring gradient -->
    <linearGradient id="gold-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae8ab" />
      <stop offset="40%" stop-color="#c99f43" />
      <stop offset="80%" stop-color="#8a6723" />
      <stop offset="100%" stop-color="#543c12" />
    </linearGradient>
  </defs>

  <g filter="url(#ffxiv-shadow)">
    <!-- 1. GOLD CONNECTOR BASE (protruding along the straight edge) -->
    <path d="M 58 48 L 74 35 L 83 46 L 67 59 Z" fill="url(#gold-grad)" stroke="#4a3610" stroke-width="0.8" stroke-linejoin="round" />
    <!-- Connector pins / notches -->
    <path d="M 69 40 L 77 47 M 66 43 L 74 50 M 63 46 L 71 53" stroke="#4a3610" stroke-width="1" stroke-linecap="round" />
    <path d="M 70 38 L 78 45" stroke="#fceab8" stroke-width="0.6" stroke-linecap="round" />

    <!-- 2. MAIN METALLIC OUTER CASING (semicircular arch tilted at -38.6°) -->
    <!-- Arc from (14, 66) curving through (10, 36) -> (26, 14) -> (52, 9) -> (78, 20) -> (88, 38) -> (31, 84) -->
    <path d="M 27 84 
             C 18 76, 12 65, 9 52 
             C 5 35, 14 19, 28 11 
             C 43 3, 62 4, 76 13 
             C 86 19, 93 30, 93 42 
             L 27 84 Z" 
          fill="url(#casing-grad)" 
          stroke="url(#bevel-grad)" 
          stroke-width="1.8" 
          stroke-linejoin="round" />

    <!-- 3. INNER DARK METALLIC FACE PLATE -->
    <path d="M 29 80 
             C 21 73, 16 63, 13 51 
             C 10 36, 18 22, 30 15 
             C 43 8, 60 9, 72 17 
             C 82 23, 88 32, 88 43 
             L 29 80 Z" 
          fill="url(#plate-grad)" 
          stroke="#12100f" 
          stroke-width="1" 
          stroke-linejoin="round" />

    <!-- Subtle metallic rim line -->
    <path d="M 32 77 
             C 24 70, 20 62, 17 50 
             C 14 38, 21 26, 32 19 
             C 44 12, 59 13, 70 20 
             C 79 26, 84 34, 85 43" 
          fill="none" 
          stroke="#524a42" 
          stroke-width="0.8" 
          stroke-opacity="0.6" />

    <!-- 4. ALLAGAN CYAN CIRCUIT NETWORK (Glowing geometric traces) -->
    <g filter="url(#ffxiv-cyan-glow)">
      <!-- Outer perimeter circuit arc -->
      <path d="M 22 70 
               C 17 58, 17 44, 21 32 
               C 24 23, 31 16, 42 14 
               C 55 12, 69 16, 78 24 
               C 83 28, 86 34, 86 38" 
            fill="none" 
            stroke="#00f5ff" 
            stroke-width="3.4" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <path d="M 22 70 
               C 17 58, 17 44, 21 32 
               C 24 23, 31 16, 42 14 
               C 55 12, 69 16, 78 24 
               C 83 28, 86 34, 86 38" 
            fill="none" 
            stroke="#e0ffff" 
            stroke-width="1.2" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Circuit branch: Top-center inward fork -->
      <path d="M 43 14 L 38 28 L 46 34 L 46 41" 
            fill="none" 
            stroke="#00f5ff" 
            stroke-width="2.6" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <path d="M 43 14 L 38 28 L 46 34 L 46 41" 
            fill="none" 
            stroke="#e0ffff" 
            stroke-width="0.9" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Circuit branch: Left arc to Lower Core -->
      <path d="M 21 32 L 31 38 L 38 48" 
            fill="none" 
            stroke="#00f5ff" 
            stroke-width="2.8" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <path d="M 21 32 L 31 38 L 38 48" 
            fill="none" 
            stroke="#e0ffff" 
            stroke-width="0.9" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Circuit branch: Lower Core to Bottom Edge -->
      <path d="M 38 52 L 25 63 L 23 71" 
            fill="none" 
            stroke="#00f5ff" 
            stroke-width="2.8" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <path d="M 38 52 L 25 63 L 23 71" 
            fill="none" 
            stroke="#e0ffff" 
            stroke-width="0.9" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Circuit branch: Diagonal bridge between cores & to connector -->
      <path d="M 40 52 L 53 58 L 59 52" 
            fill="none" 
            stroke="#00f5ff" 
            stroke-width="2.6" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <path d="M 40 52 L 53 58 L 59 52" 
            fill="none" 
            stroke="#e0ffff" 
            stroke-width="0.8" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

      <!-- Branch to Upper Core -->
      <path d="M 52 42 L 58 36 L 68 33" 
            fill="none" 
            stroke="#00f5ff" 
            stroke-width="2.4" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <path d="M 52 42 L 58 36 L 68 33" 
            fill="none" 
            stroke="#e0ffff" 
            stroke-width="0.8" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>

    <!-- 5. UPPER ALLAGAN ENERGY CORE (at approx 60, 35) -->
    <!-- Gold outer bezel -->
    <circle cx="60" cy="35" r="7.2" fill="url(#gold-ring-grad)" stroke="#4a3610" stroke-width="0.8" />
    <!-- Inner bezel bevel -->
    <circle cx="60" cy="35" r="5.2" fill="#171514" />
    <!-- Glowing Cyan Lens -->
    <circle cx="60" cy="35" r="4.2" fill="url(#core-glow-1)" filter="url(#ffxiv-cyan-glow)" />
    <!-- Specular highlight -->
    <circle cx="58.6" cy="33.6" r="1.3" fill="#ffffff" opacity="0.9" />

    <!-- 6. LOWER ALLAGAN ENERGY CORE (at approx 38, 50) -->
    <!-- Gold outer bezel -->
    <circle cx="38" cy="50" r="7.2" fill="url(#gold-ring-grad)" stroke="#4a3610" stroke-width="0.8" />
    <!-- Inner bezel bevel -->
    <circle cx="38" cy="50" r="5.2" fill="#171514" />
    <!-- Glowing Cyan Lens -->
    <circle cx="38" cy="50" r="4.2" fill="url(#core-glow-1)" filter="url(#ffxiv-cyan-glow)" />
    <!-- Specular highlight -->
    <circle cx="36.6" cy="48.6" r="1.3" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
