<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- ظل خفيف للأيقونة -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- الحرف 'e' المكتوب بخط يدوي بالأسود -->
    <path d="M 60 295 
             C 70 250, 120 180, 210 150 
             C 290 120, 340 160, 315 220 
             C 290 280, 190 290, 85 285 
             C 80 325, 110 365, 160 375 
             C 210 385, 260 365, 290 320" 
          fill="none" 
          stroke="#000000" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

        <!-- جسم علامة التعجب '!' بالأسود -->
    <path d="M 405 25 
             C 425 25, 435 45, 420 85 
             L 365 295 
             C 360 315, 345 320, 340 310 
             C 335 300, 340 285, 345 270 
             L 385 45 
             C 390 30, 395 25, 405 25 Z" 
          fill="#000000"/>

        <!-- نقطة علامة التعجب بالأسود -->
    <circle cx="330" cy="380" r="38" fill="#000000"/>
  </g>
</svg>
